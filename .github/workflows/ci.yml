name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      # Actions fijadas por SHA de commit, como en el portafolio
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      # .npmrc: sin scripts de instalación y solo desde el registro de npm
      - run: npm ci
      - run: npx astro check
      - run: npx vitest run
      - run: npx astro build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
      # Lighthouse móvil (constitución IV): se añade en R10, cuando @lhci/cli cumpla los 7 días
      # Falla con avisos high o critical, salvo las excepciones fechadas de scripts/audit.mjs
      - run: npm run audit
